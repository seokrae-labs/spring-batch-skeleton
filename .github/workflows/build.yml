name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: Smoke test README commands
        run: scripts/smoke-test.sh
      - name: Test hook scripts
        run: scripts/test-hooks.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with a JDK 25 toolchain provisioned by Gradle
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$JAVA_HOME/bin/java" -version
          ./gradlew build -Porg.gradle.java.installations.auto-detect=false
          ls "$HOME/.gradle/jdks"
