name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --warning-mode=fail
      - name: Smoke test README commands
        run: scripts/smoke-test.sh
      - name: Test hook scripts
        run: scripts/test-hooks.sh
      - name: Test build rules
        run: scripts/test-build-rules.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with a JDK 25 toolchain provisioned by Gradle
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$JAVA_HOME/bin/java" -version
          ./gradlew build -Porg.gradle.java.installations.auto-detect=false
          ls "$HOME/.gradle/jdks"

  guarded-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Flag changes to build rules, checks, and agent rules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/flag-guarded-changes.sh "origin/$BASE_REF"
